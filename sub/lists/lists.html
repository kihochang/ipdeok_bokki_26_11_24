
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>메뉴 리스트</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../../css/style.css">

    <!-- 리스트 페이지 CSS -->
    <link rel="stylesheet" href="css/lists.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">

            <a href="../../index.html" class="logo">
                <img src="../../img/logo.jpg" alt="Logo">
                <span>입덕볶이</span>
            </a>

            <button class="menu-button" type="button"
                    aria-label="메뉴 열기"
                    aria-expanded="false"
                    aria-controls="side-menu">

                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24" height="24"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M4 12h16"/>
                    <path d="M4 18h16"/>
                    <path d="M4 6h16"/>
                </svg>

            </button>

        </header>


        <!-- MENU LIST -->
        <main class="list-content">

            <!-- MENU 1 -->
            <div class="menu-item">
                <a href="../detail/detail.html">
                    <div class="menu-image">
                        <img src="../../img/menu_1.jpg" alt="오리지널 떡볶이">
                    </div>
                    <p class="menu-title">오리지널 떡볶이</p>
                </a>
            </div>

            <!-- MENU 2 -->
            <div class="menu-item">
                <a href="../detail/detail.html">
                    <div class="menu-image">
                        <img src="../../img/menu_2.jpg" alt="메뉴 2">
                    </div>
                    <p class="menu-title">메뉴 2</p>
                </a>
            </div>

            <!-- MENU 3 -->
            <div class="menu-item">
                <a href="../detail/detail.html">
                    <div class="menu-image">
                        <img src="../../img/menu_3.jpg" alt="메뉴 3">
                    </div>
                    <p class="menu-title">메뉴 3</p>
                </a>
            </div>

            <!-- MENU 4 -->
            <div class="menu-item">
                <a href="../detail/detail.html">
                    <div class="menu-image">
                        <img src="../../img/menu_4.jpg" alt="메뉴 4">
                    </div>
                    <p class="menu-title">메뉴 4</p>
                </a>
            </div>

        </main>

    </div>


    <!-- MENU OVERLAY -->
    <div class="menu-overlay"></div>


    <!-- SIDE MENU -->
    <nav class="side-menu" id="side-menu">

        <div class="side-menu-header">
            <span>MENU</span>

            <button class="close-button" type="button"
                    aria-label="메뉴 닫기">

                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24" height="24"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M18 6 6 18"/>
                    <path d="m6 6 12 12"/>
                </svg>

            </button>
        </div>

        <ul class="side-menu-list">
            <li><a href="../../index.html">메인페이지</a></li>
            <li><a href="../lists/lists.html">리스트페이지</a></li>
            <li><a href="../detail/detail.html">상세페이지</a></li>
            <li><a href="../payment/payment.html">결제페이지</a></li>
            <li><a href="../payment_finish/payment_finish.html">결제완료페이지</a></li>
        </ul>

    </nav>


    <!-- MENU SCRIPT -->
    <script>
        const menuButton = document.querySelector('.menu-button');
        const closeButton = document.querySelector('.close-button');
        const menuOverlay = document.querySelector('.menu-overlay');
        const sideMenu = document.querySelector('.side-menu');

        // 메뉴 열기
        function openMenu() {
            sideMenu.classList.add('active');
            menuOverlay.classList.add('active');

            menuButton.setAttribute('aria-expanded', 'true');
        }

        // 메뉴 닫기
        function closeMenu() {
            sideMenu.classList.remove('active');
            menuOverlay.classList.remove('active');

            menuButton.setAttribute('aria-expanded', 'false');
        }

        menuButton.addEventListener('click', openMenu);
        closeButton.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);
    </script>

</body>
</html>
