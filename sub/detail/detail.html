
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 상세페이지</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../../css/style.css">

    <!-- 상세페이지 CSS -->
    <link rel="stylesheet" href="css/detail.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <a href="../../index.html" class="logo">
                         <img src="../../img/logo.jpg" alt="Logo">
        <span>입덕볶이</span>
            </a>

            <button class="menu-button" type="button"
                    aria-label="메뉴 열기"
                    aria-expanded="false"
                    aria-controls="side-menu">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24" height="24"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round">
                    <path d="M4 12h16"/>
                    <path d="M4 18h16"/>
                    <path d="M4 6h16"/>
                </svg>
            </button>
        </header>


        <!-- MAIN IMAGE -->
        <main class="detail-content">

            <div class="detail-image">
                <img src="../../img/main_1.jpg" alt="">
            </div>


            <!-- MENU INFORMATION -->
            <section class="detail-info">

                <h2>메뉴 상세페이지</h2>

                <p>
                    인덱스 페이지의 메뉴 설명 텍스트를 참고하여
                    메뉴에 대한 상세 정보를 표시합니다.
                </p>

            </section>


            <div class="detail-divider"></div>


            <!-- ADD INGREDIENTS -->
            <section class="ingredient-section">

                <h3>재료 추가</h3>

                <div class="ingredient-list">

                    <label class="ingredient-item">
                        <span>
                            <input type="checkbox" checked>
                            치즈 추가
                        </span>
                        <strong>10원</strong>
                    </label>

                    <label class="ingredient-item">
                        <span>
                            <input type="checkbox" checked>
                            양배추 추가
                        </span>
                        <strong>10원</strong>
                    </label>

                    <label class="ingredient-item">
                        <span>
                            <input type="checkbox" checked>
                            비엔나 추가
                        </span>
                        <strong>10원</strong>
                    </label>

                    <label class="ingredient-item">
                        <span>
                            <input type="checkbox" checked>
                            콘치즈 추가
                        </span>
                        <strong>10원</strong>
                    </label>

                </div>

            </section>


            <div class="detail-divider"></div>


            <!-- PAYMENT BUTTON -->
            <a href="../payment/payment.html">
            <div class="payment-button-wrap">
                <button class="payment-button" type="button">
                    결제하기
                </button>
            </div>
        </a>

        </main>

    </div>


    <!-- MENU OVERLAY -->
    <div class="menu-overlay"></div>

    <!-- SIDE MENU -->
    <nav class="side-menu" id="side-menu">

        <div class="side-menu-header">
            <span>MENU</span>
            <button class="close-button" type="button"
                    aria-label="메뉴 닫기">
                ✕
            </button>
        </div>

        <ul class="side-menu-list">
            <li><a href="../lists/lists.html">리스트페이지</a></li>
            <li><a href="detail.html">상세페이지</a></li>
            <li><a href="../payment/payment.html">결제페이지</a></li>
            <li><a href="../payment_finish/payment_finish.html">결제완료</a></li>
        </ul>

    </nav>


    <!-- MENU SCRIPT -->
    <script>
        const menuButton = document.querySelector('.menu-button');
        const closeButton = document.querySelector('.close-button');
        const menuOverlay = document.querySelector('.menu-overlay');
        const sideMenu = document.querySelector('.side-menu');

        function openMenu() {
            sideMenu.classList.add('active');
            menuOverlay.classList.add('active');
            menuButton.setAttribute('aria-expanded', 'true');
        }

        function closeMenu() {
            sideMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
            menuButton.setAttribute('aria-expanded', 'false');
        }

        menuButton.addEventListener('click', openMenu);
        closeButton.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);
    </script>

</body>
</html>
