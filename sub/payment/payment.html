
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제페이지</title>

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="css/payment.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <a href="../../index.html" class="logo">
                         <img src="../../img/logo.jpg" alt="Logo">
        <span>입덕볶이</span>
            </a>

            <button class="menu-button" type="button"
                    aria-label="메뉴 열기"
                    aria-expanded="false"
                    aria-controls="side-menu">
                <svg xmlns="http://www.w3.org/2000/svg"
                     width="24" height="24"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round">
                    <path d="M4 12h16"/>
                    <path d="M4 18h16"/>
                    <path d="M4 6h16"/>
                </svg>
            </button>
        </header>


        <!-- STORE TITLE -->
        <h2 class="store-title">입덕볶이 본점</h2>


        <!-- PRODUCT INFORMATION -->
        <section class="product-area">

            <div class="product-image">
                <img src="../../img/main_1.jpg" alt="">
            </div>

            <div class="product-info">

                <h3>맛있는 덕볶이</h3>

                <div class="product-options">
                    <p>옵션 : 치즈 추가</p>
                    <p>옵션 : 양배추 추가</p>
                    <p>옵션 : 비엔나 추가</p>
                    <p>옵션 : 콘치즈 추가</p>
                </div>

                <div class="product-bottom">

                    <div class="quantity-control">
                        <button type="button">-</button>
                        <span>1</span>
                        <button type="button">+</button>
                    </div>

                    <strong class="product-price">140원</strong>

                </div>

            </div>

        </section>


        <!-- PAYMENT METHOD -->
        <section class="payment-method">

            <h3>결제수단 선택</h3>

            <div class="payment-radio">
                <label>
                    <input type="radio" name="payment" checked>
                    카드 일반 결제
                </label>

                <label>
                    <input type="radio" name="payment">
                    기타 결제수단
                </label>
            </div>


            <!-- SIMPLE PAYMENT -->
            <div class="simple-payment">

                <button type="button">네이버페이</button>
                <button type="button">카카오페이</button>
                <button type="button">페이코</button>
                <button type="button">토스페이</button>

            </div>

        </section>


        <!-- PAYMENT BUTTON -->
        <a href="../payment_finish/payment_finish.html">
        <div class="payment-action">
            
            <button type="button" class="final-payment-button">
                140원 결제하기
            </button>

            <p class="payment-notice">
                주문 관련 약관 및 개인정보 수집 및 이용안내
                내용을 확인하였으며, 결제에 동의합니다.
            </p>

        </div>
        </a>

    </div>


    <!-- MENU OVERLAY -->
    <div class="menu-overlay"></div>

    <!-- SIDE MENU -->
    <nav class="side-menu" id="side-menu">

        <div class="side-menu-header">
            <span>MENU</span>
            <button class="close-button" type="button"
                    aria-label="메뉴 닫기">
                ✕
            </button>
        </div>

        <ul class="side-menu-list">
            <li><a href="../lists/lists.html">리스트페이지</a></li>
            <li><a href="../detail/detail.html">상세페이지</a></li>
            <li><a href="payment.html">결제페이지</a></li>
            <li><a href="../payment_finish/payment_finish.html">결제완료</a></li>
        </ul>

    </nav>


    <!-- MENU SCRIPT -->
    <script>
        const menuButton = document.querySelector('.menu-button');
        const closeButton = document.querySelector('.close-button');
        const menuOverlay = document.querySelector('.menu-overlay');
        const sideMenu = document.querySelector('.side-menu');

        function openMenu() {
            sideMenu.classList.add('active');
            menuOverlay.classList.add('active');
            menuButton.setAttribute('aria-expanded', 'true');
        }

        function closeMenu() {
            sideMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
            menuButton.setAttribute('aria-expanded', 'false');
        }

        menuButton.addEventListener('click', openMenu);
        closeButton.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);
    </script>

</body>
</html>
