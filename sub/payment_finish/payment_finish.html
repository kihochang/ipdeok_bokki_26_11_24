
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결제완료</title>

    <!-- 공통 CSS -->
    <link rel="stylesheet" href="../../css/style.css">

    <!-- 결제완료 CSS -->
    <link rel="stylesheet" href="css/payment_finish.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <header class="finish-header">
            <a href="../../index.html">
            <button class="refresh-button"
                    type="button"
                    aria-label="페이지 새로고침"
                    onclick="location.reload()">

                <svg xmlns="http://www.w3.org/2000/svg"
                     width="22"
                     height="22"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M20 7v5h-5"/>
                    <path d="M20 12a8 8 0 1 0 2 5"/>

                </svg>

            </button>
            </a>

            <h2>결제가 완료되었습니다.</h2>

        </header>


        <!-- ORDER DETAILS -->
        <section class="order-section">

            <h3 class="section-heading">주문내역</h3>

            <div class="order-product">

                <div class="order-product-title">
                    <span>맛있는 덕볶이 1개</span>
                    <strong>100원</strong>
                </div>

                <div class="order-options">
                    <p>옵션 : 치즈 추가(10원)</p>
                    <p>옵션 : 콘치즈 추가(10원)</p>
                    <p>옵션 : 양배추 추가(10원)</p>
                    <p>옵션 : 비엔나 추가(10원)</p>
                </div>

            </div>

        </section>


        <!-- PRICE SUMMARY -->
        <section class="price-section">

            <div class="price-row">
                <span>주문금액</span>
                <strong>140원</strong>
            </div>

            <div class="price-row">
                <span>배달금액</span>
                <strong>3000원</strong>
            </div>

            <div class="price-row">
                <span>할인금액</span>
                <strong>-3000원</strong>
            </div>

        </section>


        <!-- TOTAL PRICE -->
        <section class="total-section">

            <div class="total-row">
                <strong>총 결제 금액</strong>
                <strong>140원</strong>
            </div>

        </section>

    </div>

</body>
</html>
